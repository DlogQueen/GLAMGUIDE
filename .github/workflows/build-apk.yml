# 📱 GitHub Actions - Build Android APK
name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Manual trigger

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build web app
      run: npm run build
      
    - name: Sync Capacitor
      run: npx cap sync android
      
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Build APK
      run: |
        cd android
        ./gradlew assembleRelease
        
    - name: Sign APK (optional - for production)
      if: github.ref == 'refs/heads/main'
      uses: r0adkll/sign-android-release@v1
      with:
        releaseDirectory: android/app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}
      env:
        BUILD_TOOLS_VERSION: "33.0.0"
        
    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: glam-guide-ai-apk
        path: android/app/build/outputs/apk/release/*.apk
        
    - name: Create Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        files: android/app/build/outputs/apk/release/*.apk
        tag_name: v${{ github.run_number }}
        name: Release v${{ github.run_number }}
        body: |
          ## Glam Guide AI - Android APK
          
          📱 **Download the APK and install on your Android device**
          
          ### Installation:
          1. Download the APK file
          2. Enable "Unknown Sources" in Settings > Security
          3. Tap the APK to install
          4. Open Glam Guide AI!
          
          ### Features:
          - 🤖 AI Makeup Coach
          - 📱 AR Try-On
          - 🎨 50+ Tutorials
          - 🌈 Inclusive for ALL
          
          ### Note:
          This is a release build. For beta testing, join our program at https://glamguide.ai/beta
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
